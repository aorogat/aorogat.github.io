<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Hard Drive Explorer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>

:root{
  --bg:#F3F6FA; --panel:#FFFFFF; --ink:#13233A; --ink2:#3B4B63; --muted:#5A6A81; --line:#CCD6E4; --soft:#E8EEF6;
  --cpu:#1F3A5F; --data:#2F5D9E; --datasoft:#DCE8F7; --pipe:#2F5D9E; --ram:#2E7D4F; --ramsoft:#E4F3EA; --disk:#4B5563;
  --active:#C8323C; --activesoft:#FBE3E5;
  --p1:#2F5D9E; --p1soft:#DCE8F7; --p2:#8A4F9E; --p2soft:#F1E6F5; --p3:#A86207; --p3soft:#FCEFD9;
  --s1:#2F5D9E; --s2:#A86207; --s3:#8A4F9E; --s4:#2E7D4F;
  --f-display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --f-math:"IBM Plex Serif","Cambria Math","STIX Two Math",Georgia,serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1622; --panel:#152131; --ink:#E4ECF6; --ink2:#AEBBD0; --muted:#9AAAC0; --line:#2C3D55; --soft:#1C2A3D;
  --cpu:#8FB3E6; --data:#7FA8E8; --datasoft:#1D3150; --pipe:#7FA8E8; --ram:#5CC28A; --ramsoft:#13291F; --disk:#A9B4C3;
  --active:#FF6B6B; --activesoft:#3A1C22;
  --p1:#7FA8E8; --p1soft:#1D3150; --p2:#D29BE6; --p2soft:#33213D; --p3:#F2B04B; --p3soft:#3A2C12; --s1:#6A93D6; --s2:#C9822A; --s3:#A673BE; --s4:#45A06F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1622; --panel:#152131; --ink:#E4ECF6; --ink2:#AEBBD0; --muted:#9AAAC0; --line:#2C3D55; --soft:#1C2A3D;
  --cpu:#8FB3E6; --data:#7FA8E8; --datasoft:#1D3150; --pipe:#7FA8E8; --ram:#5CC28A; --ramsoft:#13291F; --disk:#A9B4C3;
  --active:#FF6B6B; --activesoft:#3A1C22;
  --p1:#7FA8E8; --p1soft:#1D3150; --p2:#D29BE6; --p2soft:#33213D; --p3:#F2B04B; --p3soft:#3A2C12; --s1:#6A93D6; --s2:#C9822A; --s3:#A673BE; --s4:#45A06F; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 28px}
.wrap{max-width:1320px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.wrap>*{min-width:0}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(24px,3.2vw,34px);letter-spacing:.2px;margin:0;line-height:1.1;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0;max-width:80ch}
.path ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(var(--n,6),minmax(0,1fr));gap:6px}
@media (max-width:980px){.path ol{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.path ol{grid-template-columns:repeat(2,minmax(0,1fr))}}
.path button{width:100%;height:100%;text-align:left;display:flex;gap:10px;align-items:flex-start;font-family:var(--f-body);padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.path .num{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--soft);color:var(--ink)}
.path b{display:block;font-size:14px;line-height:1.2}
.path small{display:block;color:var(--muted);font-size:12px;line-height:1.3;margin-top:2px}
.path button[aria-current="step"]{border-color:var(--cpu);box-shadow:inset 0 0 0 1px var(--cpu)}
.path button[aria-current="step"] .num{background:var(--cpu);color:var(--panel)}
.stagecard{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.caption{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,320px) auto;gap:16px;align-items:start;padding:14px 18px;border-bottom:1px solid var(--line);min-height:116px}
@media (max-width:980px){.caption{grid-template-columns:minmax(0,1fr)}}
.stepline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.chip{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--datasoft);color:var(--cpu)}
.stepno{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
#say{font-size:20px;line-height:1.4;margin:0;font-weight:500;max-width:70ch}
.why{color:var(--muted);margin:6px 0 0;font-size:15px;max-width:75ch}
.terms{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:13.5px}
.terms:empty{display:none}
.terms h5{margin:0 0 4px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--active)}
.terms p{margin:0 0 6px} .terms p:last-child{margin:0}
.player{display:flex;gap:8px;align-items:center}
.player[hidden]{display:none}
.btn{font-family:var(--f-body);font-weight:600;font-size:14px;border-radius:6px;border:1px solid var(--line);background:var(--soft);color:var(--ink);padding:7px 14px;cursor:pointer}
.btn.primary{background:var(--cpu);color:var(--panel);border-color:var(--cpu)}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,select:focus-visible,input:focus-visible,button:focus-visible{outline:2px solid var(--active);outline-offset:2px}
.nextbtn{margin-top:0}
.side{display:grid;gap:10px;justify-items:end;align-content:start}
@media (max-width:980px){.side{justify-items:start}}
.stage{overflow-x:auto}
.stage svg{display:block;width:100%;min-width:960px;height:auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 18px;min-width:0}
.card[hidden]{display:none}
.card h3{font-family:var(--f-display);font-size:20px;margin:0 0 10px}
.card h4{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:14px 0 6px}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.presets .btn{font-size:13px;padding:5px 10px}
.form{display:flex;flex-wrap:wrap;gap:10px 22px;margin-bottom:8px}
.form label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;align-items:center;gap:6px;min-width:0;max-width:100%}
.form .chk{text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink)}
select{font-family:var(--f-body);font-size:14px;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:5px 8px;max-width:100%;min-width:0}
.explain{margin:0;padding-left:1.2em;display:grid;gap:4px;font-size:14px}
.explain li.chg{color:var(--active)}
.explain em{font-style:normal;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;border:1px solid var(--active);border-radius:999px;padding:0 6px;margin-left:4px}
details{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 16px}
summary{cursor:pointer;font-weight:600}
dl{margin:8px 0 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px 18px}
.term dt{font-weight:600;font-size:14px} .term dd{margin:0;color:var(--muted);font-size:13.5px}
.note{color:var(--muted);font-size:13px}
/* svg text */
.box{fill:var(--panel);stroke:var(--line);stroke-width:1.2}
.kicker{font-family:var(--f-body);font-size:11.5px;font-weight:600;letter-spacing:.08em;fill:var(--muted)}
.hero{font-family:var(--f-display);font-weight:700;font-size:40px;fill:var(--ink)}
.big{font-family:var(--f-display);font-weight:700;font-size:20px;fill:var(--ink)}
.lab{font-family:var(--f-body);font-size:13.5px;fill:var(--ink)}
.labm{font-family:var(--f-body);font-size:11.5px;fill:var(--muted)}
.code{font-family:var(--f-mono);font-size:13px;fill:var(--ink)}
.codes{font-family:var(--f-mono);font-size:11.5px;fill:var(--ink)}
.math{font-family:var(--f-math);font-size:16px;fill:var(--ink)}
.pill{font-family:var(--f-mono);font-size:11px;font-weight:600;fill:var(--ink)}
.pchip{font-family:var(--f-mono);font-size:11px;font-weight:600}
.sym{font-family:var(--f-math);font-size:20px;font-weight:400}
.nodet{font-family:var(--f-mono);font-size:12.5px;font-weight:600;fill:var(--ink)}
.phys{font-family:var(--f-body);font-size:11.5px;fill:var(--ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.btn.ghost{background:transparent}
.tt{font-family:var(--f-mono);font-size:10.5px;fill:var(--ink)}
.tts{font-family:var(--f-mono);font-size:9.5px;fill:var(--muted)}

/* ---------- lab site additions */
:root{--ftab:#2F5D9E;--fidx:#8A4F9E;--fcat:#A86207;--foth:#B9C3D0;--wseek:#3E4E66;--wrot:#9AA8BC;--xfer:#2F5D9E;--plat:#E9EEF5;--metal:#6B7788}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ftab:#6A93D6;--fidx:#A673BE;--fcat:#C9822A;--foth:#3D4B60;--wseek:#9AA9C0;--wrot:#56657D;--xfer:#6A93D6;--plat:#1A2738;--metal:#8D99AB}}
:root[data-theme="dark"]{--ftab:#6A93D6;--fidx:#A673BE;--fcat:#C9822A;--foth:#3D4B60;--wseek:#9AA9C0;--wrot:#56657D;--xfer:#6A93D6;--plat:#1A2738;--metal:#8D99AB}
.crumbs{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.crumbs a{color:var(--cpu);font-weight:600;text-decoration:none}
.crumbs a:hover{text-decoration:underline}
.hexs{font-family:var(--f-mono);font-size:10px;font-weight:600}
.hexb{font-family:var(--f-mono);font-size:12px;font-weight:600;fill:var(--ink)}
.cmd{font-family:var(--f-mono);font-size:12px;fill:var(--ink);white-space:pre}
.code,.codes{white-space:pre}
/* Hard drive explorer. One screen: the drive and RAM on the left, a tabbed rail on the right. */
.hdx{--f1:#2F5D9E;--f2:#0E8A7A;--f3:#8A4F9E;position:relative;height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);gap:10px;font-size:14px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hdx{--f1:#6A93D6;--f2:#33A28F;--f3:#B07ACB}}
:root[data-theme="dark"] .hdx{--f1:#6A93D6;--f2:#33A28F;--f3:#B07ACB}
.hdx-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.hdx-bar h1{font-family:var(--f-display);font-size:21px;margin:0 2px 0 0;line-height:1;white-space:nowrap}
.hdx-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hdx-scale{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--panel)}
.hdx-scale button{font:600 13px/1 var(--f-body);color:var(--ink);background:none;border:0;border-left:1px solid var(--line);padding:7px 8px;cursor:pointer}
.hdx-scale button:first-child{border-left:0}
.hdx-scale button.on{background:var(--cpu);color:var(--panel)}
.hdx-f{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)}
.hdx-f select{font:500 13px var(--f-body);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 4px;max-width:175px}
.hdx-aboutbtn{font-family:var(--f-mono)!important;width:30px;padding:6px 0!important;text-align:center}
.hdx-end{margin-left:auto;display:flex;gap:6px}
.hdx .btn{padding:6px 11px;font-size:13px}
.hdx .btn.ghost{background:var(--panel)}
.hdx-stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,400px);gap:12px;min-height:0}
.hdx-viz,.hdx-rail{background:var(--panel);border:1px solid var(--line);border-radius:12px;min-height:0;min-width:0}
.hdx-viz{display:grid;grid-template-rows:minmax(0,1fr) auto auto auto auto auto;overflow:hidden}
.hdx-canvaswrap{position:relative;min-height:0}
.hdx-canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hdx-look{display:flex;gap:10px;align-items:flex-start;margin:0 12px 8px;padding:8px 12px;background:var(--activesoft);border-radius:8px}
.hdx-look p{margin:0;font-size:14px;line-height:1.45;max-width:95ch}
.hdx-x{margin-left:auto;border:0;background:none;font-size:20px;line-height:1;color:var(--ink2);cursor:pointer;padding:0 4px}
.hdx-dock{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding:8px 12px 4px;border-top:1px solid var(--line)}
.hdx-clear{margin-left:auto}
.hdx-grp{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.hdx-grp>span{font-size:12px;color:var(--muted)}
.hdx-playgrp{margin-left:auto}
.hdx-speed{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.hdx-speed button{font:600 12.5px/1 var(--f-body);background:var(--panel);color:var(--ink);border:0;border-left:1px solid var(--line);padding:7px 8px;cursor:pointer}
.hdx-speed button:first-child{border-left:0}
.hdx-speed button[aria-pressed="true"]{background:var(--cpu);color:var(--panel)}
.hdx-statusline{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:4px 12px 0;min-height:34px}
.hdx-rate{flex:1}
.hdx-pill{font:700 13px/1 var(--f-body);padding:5px 10px;border-radius:999px;background:var(--soft);color:var(--muted)}
.hdx-pill.go{background:var(--activesoft);color:var(--active)}
.hdx-pill.ok{background:var(--ramsoft);color:var(--ram)}
.hdx-pill.cpu{background:var(--cpu);color:var(--panel)}
.hdx-pill.goal{background:var(--ink);color:var(--panel)}
.hdx-goal{border:2px solid var(--ink);border-radius:10px;padding:9px 12px 10px;background:var(--soft)}
.hdx-goal.now{box-shadow:0 0 0 4px var(--activesoft)}
.hdx-goal span{display:block;font-size:11.5px;font-weight:700;color:var(--muted)}
.hdx-goal b{display:block;font:600 15px var(--f-mono);color:var(--ink);margin-top:2px;overflow-wrap:anywhere}
.hdx-goal p{margin:4px 0 0;font-size:12.5px;line-height:1.4;color:var(--ink2)}
.hdx-clock{font:600 13px var(--f-mono);color:var(--ink);font-variant-numeric:tabular-nums}
.hdx-rate{font-size:12.5px;color:var(--muted);min-width:0}
.hdx-timesvg{display:block;width:calc(100% - 24px);height:auto;margin:6px 12px 10px}
.hdx-rail{display:grid;grid-template-rows:auto minmax(0,1fr)}
.hdx-tabs{display:flex;border-bottom:1px solid var(--line)}
.hdx-tabs button{flex:1;font:600 13px var(--f-body);color:var(--muted);background:none;border:0;border-bottom:2px solid transparent;padding:10px 4px 8px;cursor:pointer}
.hdx-tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--cpu)}
.hdx-pane{overflow:auto;padding:12px 14px 14px;display:grid;gap:14px;align-content:start;min-height:0}
.hdx-pane section{min-width:0}
.hdx-pane h3{font:600 13.5px var(--f-body);color:var(--ink);margin:0 0 6px;letter-spacing:0;text-transform:none}
.hdx-pane svg{display:block;width:100%;height:auto}
.hdx-req{margin:0;font-size:13.5px;color:var(--ink2);line-height:1.45}
.hdx-kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:-8px 0 0;font-size:13px}
.hdx-kv dt{color:var(--muted)}
.hdx-kv dd{margin:0;font:600 12.5px var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink)}
.hdx-meta{margin:0 0 6px;font-size:12px;color:var(--muted)}
.hdx-tblwrap{overflow-x:auto}
.hdx-rows{border-collapse:collapse;width:100%;font:12px var(--f-mono);font-variant-numeric:tabular-nums}
.hdx-rows th{text-align:left;font:600 11px var(--f-body);color:var(--muted);padding:3px 6px;border-bottom:1px solid var(--line)}
.hdx-rows td{padding:3px 6px;white-space:nowrap;border-bottom:1px solid var(--soft);color:var(--ink)}
.hdx-rows tr.on td{background:var(--activesoft);color:var(--active);font-weight:600}
.hdx-rows tr.more td{color:var(--muted);font-family:var(--f-body);font-size:11.5px}
.hdx-rowctls{display:grid;gap:8px}
.hdx-rowhead{display:flex;align-items:center;gap:8px;font-size:13px}
.hdx-rowhead i{width:12px;height:12px;border-radius:2px;display:inline-block}
.hdx-rowhead output{margin-left:auto;font:600 12.5px var(--f-mono);font-variant-numeric:tabular-nums}
.hdx-rowctl input{width:100%;accent-color:var(--cpu);margin:4px 0 0}
.hdx-rowfx{margin:0;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.hdx-delta{color:var(--ram);font-weight:700}
.hdx-rowmsg{margin:10px 0 0;font-size:12.5px;color:var(--active);line-height:1.4}
.hdx-files{border-collapse:collapse;width:100%;font-size:12.5px}
.hdx-files th{text-align:left;font-weight:600;font-size:11px;color:var(--muted);padding:2px 6px;border-bottom:1px solid var(--line)}
.hdx-files td{padding:2px 6px;font-variant-numeric:tabular-nums;color:var(--ink)}
.hdx-files td:not(:first-child),.hdx-files th:not(:first-child){text-align:right;font-family:var(--f-mono);font-size:12px}
.hdx-files tr[data-f]{cursor:pointer}
.hdx-files tr.on td{background:var(--activesoft)}
.hdx-files i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:6px;background:var(--c);vertical-align:-1px}
.hdx-files i.ix{background:repeating-linear-gradient(45deg,var(--c) 0 2px,var(--panel) 2px 4px);outline:1px solid var(--c)}
.hdx-pop{position:absolute;z-index:20;right:0;top:46px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(10,20,40,.22);padding:12px 16px;max-height:calc(100% - 60px);overflow:auto}
.hdx-drawer{width:min(360px,100%)}
.hdx-drawer h2{font:600 15px var(--f-body);margin:0 0 6px;color:var(--ink)}
.hdx-drawer ol{margin:0;padding-left:24px;display:grid;gap:0}
.hdx-drawer button{font:600 13.5px var(--f-body);color:var(--cpu);background:none;border:0;padding:4px 0;cursor:pointer;text-align:left}
.hdx-drawer button:hover{text-decoration:underline}
.hdx-drawer li.hdx-tg{list-style:none;margin:10px 0 2px -24px;font-size:12px;color:var(--muted);font-weight:600}
.hdx-drawer li.hdx-tg:first-child{margin-top:0}
.hdx-about{width:min(460px,100%)}
.hdx-about p{margin:0;font-size:13px;line-height:1.5;color:var(--ink2)}
.hdx-tip{position:absolute;z-index:30;max-width:300px;background:var(--ink);color:var(--panel);font-size:12.5px;line-height:1.4;padding:6px 9px;border-radius:6px;pointer-events:none}
.hdx button:focus-visible,.hdx select:focus-visible,.hdx input:focus-visible{outline:2px solid var(--active);outline-offset:2px}
@media (max-width:999px),(max-height:579px){
  .hdx{height:auto}
  .hdx-stage{grid-template-columns:minmax(0,1fr)}
  .hdx-pane{overflow:visible}
  .hdx-playgrp{margin-left:0}
}
/* the Now pane: open the block shown */
.hdx-blkh{display:flex;align-items:center;gap:8px}
